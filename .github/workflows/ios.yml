name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch
concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Restore on every run, but only save from main so PR runs don't fill the repo's cache quota
      - name: Restore Kotlin/Native (konan) cache
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Show Xcode version
        shell: bash
        run: xcodebuild -version

      - name: Build iOS app
        # ARCHS=arm64: the project no longer has an iosX64 target (deps dropped Intel simulator support)
        run: xcodebuild -workspace ios/BikeShare/BikeShare.xcodeproj/project.xcworkspace -configuration Debug -scheme BikeShare -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO ARCHS=arm64

      - name: Save Kotlin/Native (konan) cache
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
